name: Android

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Privacy source scan
        run: |
          ! grep -RniE '3115a083/MoonDav|de\.moondav|MoonDav' app README.md SECURITY.md docs CHANGELOG.md
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Manifest and permission audit
        run: |
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="dataSync"' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml
          grep -q 'isLocalNetworkHost' app/src/main/java/de/moonexporter/app/KoSyncClient.kt
          grep -q 'android:name=".ExportService"' app/src/main/AndroidManifest.xml
          grep -q 'android:stopWithTask="false"' app/src/main/AndroidManifest.xml
          grep -q 'START_REDELIVER_INTENT' app/src/main/java/de/moonexporter/app/ExportService.kt
          grep -q 'StorageSafety.ensureCacheCapacity' app/src/main/java/de/moonexporter/app/ExportService.kt
          grep -q 'BackupPreflight.validate' app/src/main/java/de/moonexporter/app/AnalysisService.kt
          ! grep -RniE 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonExporter-1.0.19-debug
          path: app/build/outputs/apk/debug/*.apk
