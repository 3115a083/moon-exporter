name: Android

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Privacy source scan
        run: |
          ! grep -RniE '3115a083/MoonDav|de\.moondav|MoonDav' app README.md SECURITY.md
          ! grep -RniE '(Authorization: Basic|X-Auth-Key:|password\s*=\s*"[^"$]+")' app/src || true
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-test.log
      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moon-exporter-unit-test-log
          path: unit-test.log
      - name: Fail on unit-test errors
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Manifest and permission audit
        run: |
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -RniE 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonExporter-1.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
